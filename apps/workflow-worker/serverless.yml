service: n8n-worker

provider:
  name: aws
  runtime: nodejs18.x
  timeout: 60

functions:
  worker:
    handler: src/handler.handler
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - WorkerQueue
              - Arn

resources:
  Resources:
    WorkerQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: n8n-worker-queue
